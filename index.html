<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | Nimragraphix</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #051139;
      --secondary-color: #4ECDC4;
      --bg-color: #f0f0f4;
      --text-color: #1a1a1a;
      --footer-bg: #d6cfcf;
    }

    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--bg-color);
    }

    /* Stylish Header */
    header {
      background: var(--footer-bg);
      padding: 1rem 2rem;
      box-shadow: 0 4px 10px rgba(160, 65, 65, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header h1 {
      margin: 0;
      color: var(--primary-color);
      font-size: 2rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    nav a {
      text-decoration: none;
      color: var(--text-color);
      font-weight: 600;
      font-size: 1rem;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      transition: color 0.3s, background 0.3s;
    }

    nav a:hover {
      color: white;
      background: var(--primary-color);
    }

    /* Background Section */
    .background {
      flex: 1;
      display: flex;
      justify-content: center; /* Center the content horizontally */
      align-items: center; /* Center the content vertically */
      text-align: center;
      background: url('images/background.jpg') no-repeat center center/cover;
      padding: 2rem;
    }

    .background div {
      max-width: 600px;
    }

    .background h2 {
      font-size: 2rem;
      margin: 0;
      color: var(--primary-color);
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
    }

    .background p {
      font-size: 1rem;
      color: var(--text-color);
      padding: 1rem 4rem;
      border-radius: 4px;
      margin-top: 1rem; /* Add spacing between h2 and p */
    }

    footer {
      background: var(--footer-bg);
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>nimragraphix</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="skills.html">Skills</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section class="background">
    <div>
      <h2>Hello, I’m Nimra Rafique</h2>
      <p>A passionate graphic designer turning ideas into visual stories.</p>
    </div>
  </section>
  
  <footer>
    &copy; 2025 Nimra Rafique | nimragraphix. All rights reserved.
  </footer>
</body>
</html>
