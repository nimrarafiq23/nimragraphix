<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Nimragraphix</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #051139;
      --secondary-color: #4ECDC4;
      --bg-color: #f0f0f4;
      --text-color: #1a1a1a;
      --footer-bg: #d6cfcf;
    }

    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    /* Global background image for the page */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('./images/15630.jpg') no-repeat center center/cover;
      opacity: 0.15;
      z-index: -1;
    }

    main {
      flex: 1;
      padding: 3rem 1rem;
    }

    header {
      background: var(--footer-bg);
      padding: 1rem 2rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header h1 {
      margin: 0;
      color: var(--primary-color);
      font-size: 2rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    nav a {
      text-decoration: none;
      color: var(--text-color);
      font-weight: 600;
      font-size: 1rem;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      transition: color 0.3s, background 0.3s;
    }

    nav a:hover {
      color: white;
      background: var(--primary-color);
    }

    section {
      padding: 4rem 2rem;
      margin-bottom: 3rem;
      border-radius: 15px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease-in-out;
    }

    section:hover {
      transform: scale(1.02);
    }

    section h1, section h2 {
      font-size: 2.8rem;
      color: var(--primary-color);
      text-transform: uppercase;
      margin-bottom: 1rem;
      text-align: center;
    }

    /* Section-specific background images with better overlay */
    .invitation {
      background: url('./images/InvitationBackground.jpg') no-repeat center center/cover;
      background-size: 80%;
      background-position: center;
    }

    .ui-ux {
      background: url('./images/QuickBite.jpg') no-repeat center center/cover;
      background-size: 80%;
      background-position: center;
    }

    .poster {
      background: url('./images/Untitled (20).png') no-repeat center center/cover;
      background-size: 80%;
      background-position: center;
    }

    .social-media {
      background: url('./images/Post (5).jpg') no-repeat center center/cover;
      background-size: 80%;
      background-position: center;
    }

    /* Added overlay for better visibility of text */
    section::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3); /* Semi-transparent overlay */
      z-index: 1;
    }

    /* Portfolio grid styling */
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      padding: 2rem 0;
      position: relative;
      z-index: 2;
    }

    .portfolio-item img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease-in-out;
    }

    .portfolio-item img:hover {
      transform: scale(1.05);
    }

    footer {
      background: var(--footer-bg);
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: #b7afaf;
    }

  </style>
</head>
<body>
  <header>
    <h1>nimragraphix</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="skills.html">Skills</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <!-- Invitation Design Section -->
    <section class="invitation">
      <h1>Invitation Design</h1>
      <div class="video-container">
        <video controls>
          <source src="./images/Cream Brown Gold Pastel Aesthetic Elegant Simple Invitation Mobile Video (1).mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
    </section>

    <!-- UI/UX Design Section -->
    <section class="ui-ux">
      <h2>UI/UX Design</h2>
      <div class="portfolio-grid">
        <div class="portfolio-item">
          <img src="./images/QuickBite.jpg" alt="UI/UX Design">
        </div>
      </div>
    </section>

    <!-- Poster Design Section -->
    <section class="poster">
      <h2>Poster Design</h2>
      <div class="portfolio-grid">
        <div class="portfolio-item">
          <img src="./images/Untitled (20).png" alt="Poster Design">
        </div>
      </div>
    </section>

    <!-- Social Media Design Section -->
    <section class="social-media">
      <h2>Social Media Design</h2>
      <div class="portfolio-grid">
        <div class="portfolio-item">
          <img src="./images/Post (5).jpg" alt="Social Media Design">
        </div>
      </div>
    </section>
  </main>

  <footer>
    &copy; 2025 Nimra Rafique | nimragraphix. All rights reserved.
  </footer>
</body>
</html>
