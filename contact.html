<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Nimragraphix</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #051139;
      --secondary-color: #4ECDC4;
      --bg-color: #f0f0f4;
      --text-color: #1a1a1a;
      --footer-bg: #d6cfcf;
    }

    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--bg-color);
      position: relative;
    }

    /* Adding background image to the whole body */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('./images/3.jpg') no-repeat center center/cover; /* Your image here */
      opacity: 0.2; /* Add transparency */
      z-index: -1;
    }

    main {
      flex: 1;
      padding: 3rem 1rem;
    }

    header {
      background: var(--footer-bg);
      padding: 1rem 2rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header h1 {
      margin: 0;
      color: var(--primary-color);
      font-size: 2rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    nav a {
      text-decoration: none;
      color: var(--text-color);
      font-weight: 600;
      font-size: 1rem;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      transition: color 0.3s, background 0.3s;
    }

    nav a:hover {
      color: white;
      background: var(--primary-color);
    }

    section {
      padding: 2rem;
      background: rgba(255, 255, 255, 0.8); /* Slightly transparent background for text clarity */
      border-radius: 10px;
    }

    section h1 {
      font-size: 2.5rem;
      color: var(--primary-color);
      text-transform: uppercase;
      margin-bottom: 1rem;
      text-align: center;
    }

    section h2 {
      font-size: 2rem;
      color: var(--primary-color);
      text-transform: uppercase;
      margin-top: 2rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .contact-form input,
    .contact-form textarea {
      padding: 1rem;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    .contact-form button {
      padding: 1rem;
      border-radius: 5px;
      background: var(--primary-color);
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }

    .contact-form button:hover {
      background: var(--secondary-color);
    }

    footer {
      background: var(--footer-bg);
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>nimragraphix</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="skills.html">Skills</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section>
      <h1>Contact Me</h1>
      <p>Email: <a href="mailto:nimrarafiqie161@gmail.com">nimrarafiqie161@gmail.com</a></p>
      <p>Phone: 0325 5918537</p>
      <p>Location: Rawalpindi</p>
    </section>
  </main>

  <footer>
    &copy; 2025 Nimra Rafique | nimragraphix. All rights reserved.
  </footer>
</body>
</html>
